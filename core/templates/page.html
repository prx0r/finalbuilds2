<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{NAME}} — {{TAGLINE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://{{DOMAIN}}{{PATH}}">
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"SoftwareApplication","name":"{{NAME}}","url":"https://{{DOMAIN}}","applicationCategory":"DeveloperApplication","operatingSystem":"Web","description":"{{DESCRIPTION}}","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
  <style>
    :root{--primary:#000;--secondary:#fff;--accent:#3b82f6;--success:#22c55e;--warning:#f59e0b;--error:#ef4444;--font:system-ui,-apple-system,sans-serif;--border:#e5e7eb;--muted:#6b7280;--bg:#f9fafb}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:var(--font);line-height:1.6;color:var(--primary);background:var(--secondary)}
    .container{max-width:960px;margin:0 auto;padding:1.5rem}
    header{border-bottom:1px solid var(--border);padding-bottom:1rem;margin-bottom:2rem}
    header h1{font-size:1.75rem;font-weight:700;letter-spacing:-.02em}
    header p{color:var(--muted);margin-top:.25rem}
    nav{display:flex;gap:1.5rem;margin-top:.75rem}
    nav a{color:var(--accent);text-decoration:none;font-size:.875rem}
    nav a:hover{text-decoration:underline}
    .tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:1.5rem}
    .tab{padding:.75rem 1.25rem;cursor:pointer;font-size:.875rem;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s}
    .tab:hover{color:var(--primary)}
    .tab.active{color:var(--accent);border-bottom-color:var(--accent)}
    .panel{display:none}.panel.active{display:block}
    label{display:block;font-weight:500;font-size:.875rem;margin-bottom:.375rem}
    input,textarea,select{width:100%;padding:.625rem .75rem;border:1px solid #d1d5db;border-radius:6px;font-size:.9375rem;font-family:var(--font)}
    input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(59,130,246,.15)}
    textarea{resize:vertical;min-height:80px;font-family:monospace;font-size:.8125rem}
    .row{display:flex;gap:1rem}.row>*{flex:1}
    .btn{display:inline-flex;align-items:center;gap:.5rem;padding:.625rem 1.25rem;background:var(--primary);color:var(--secondary);border:none;border-radius:6px;font-size:.875rem;font-weight:500;cursor:pointer;transition:opacity .15s}
    .btn:hover{opacity:.85}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .results{margin-top:1.5rem}
    .result-card{border:1px solid var(--border);border-radius:8px;padding:1rem 1.25rem;margin-bottom:.75rem;transition:border-color .15s}
    .result-card:hover{border-color:var(--accent)}
    .result-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem}
    .domain-name{font-size:1.125rem;font-weight:600;font-family:monospace}
    .badge{display:inline-block;padding:.125rem .5rem;border-radius:999px;font-size:.75rem;font-weight:500}
    .badge-available{background:#dcfce7;color:#166534}
    .badge-taken{background:#fee2e2;color:#991b1b}
    .badge-unknown{background:#fef3c7;color:#92400e}
    .meta{display:flex;gap:1.5rem;font-size:.8125rem;color:var(--muted);margin-top:.375rem;flex-wrap:wrap}
    .records{margin-top:.75rem;font-size:.8125rem}
    .records summary{cursor:pointer;color:var(--accent);font-weight:500}
    .records pre{margin-top:.5rem;padding:.75rem;background:var(--bg);border-radius:6px;font-size:.75rem;overflow-x:auto}
    table{width:100%;border-collapse:collapse;font-size:.875rem}
    th,td{padding:.5rem .75rem;text-align:left;border-bottom:1px solid var(--border)}
    th{background:var(--bg);font-weight:600;font-size:.8125rem;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
    .empty{text-align:center;padding:3rem;color:#9ca3af}
    .loading{text-align:center;padding:2rem;color:var(--muted)}
    .error{background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:1rem;color:#991b1b}
    footer{margin-top:3rem;border-top:1px solid var(--border);padding-top:1rem;font-size:.8125rem;color:#9ca3af;display:flex;justify-content:space-between}
    footer a{color:var(--muted)}
    @media(max-width:640px){.row{flex-direction:column}.meta{flex-wrap:wrap}}
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>{{NAME}}</h1>
      <p>{{DESCRIPTION}}</p>
      <nav>{{NAV_LINKS}}</nav>
    </header>
    <main>
      {{CONTENT}}
    </main>
    <footer>
      <span>{{NAME}} v{{VERSION}}</span>
      <span><a href="{{REPO_URL}}">GitHub</a></span>
    </footer>
  </div>
</body>
</html>
